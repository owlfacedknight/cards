<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Card Case — a simple wallet for saving card identifiers and their barcodes or QR codes.">
  <meta name="theme-color" content="#171b22">
  <title>Card Case</title>
  <link rel="icon" href="icons/icon-192.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">YOUR DIGITAL WALLET</p>
        <h1>Card Case</h1>
      </div>
      <button type="button" id="btn-refresh" class="btn-refresh" aria-label="Check for app updates">↻</button>
    </header>

    <main>
      <section class="add-panel" aria-labelledby="add-heading">
        <h2 id="add-heading">Add a card</h2>
        <p class="section-description">Enter a name and card number to save it to your wallet.</p>
        <form id="add-pass-form" novalidate>
          <label for="pass-title">Card name</label>
          <input type="text" id="pass-title" placeholder="e.g. Coffee shop" autocomplete="off" maxlength="80" required>

          <label for="pass-value">Card number or ID</label>
          <input type="text" id="pass-value" placeholder="Enter card number or ID" autocomplete="off" maxlength="500" required>

          <button type="submit" class="btn-primary">Add to wallet</button>
        </form>
      </section>

      <p id="status-message" class="status-message" role="status" aria-live="polite">Loading saved cards…</p>

      <section class="wallet-section" aria-labelledby="wallet-heading">
        <div class="section-heading">
          <h2 id="wallet-heading">Saved cards</h2>
          <div class="backup-actions">
            <button type="button" id="btn-export" class="btn-secondary">Export backup</button>
            <button type="button" id="btn-import" class="btn-secondary">Import backup</button>
            <input type="file" id="backup-file" accept="application/json,.json" hidden>
          </div>
        </div>
        <div id="wallet-container" aria-live="polite"></div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
